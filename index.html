<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#080909">
<title>ROOMS — Low Detailed</title>
<style>
:root{color-scheme:dark;--gold:#c2b88d}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--gold);font:14px/1.45 "Segoe UI",Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body{padding:0}.shell{position:fixed;inset:0;width:100vw;height:100dvh;background:#050706}.gameframe{position:absolute;inset:0;overflow:hidden}#game{display:block;width:100%;height:100%;image-rendering:auto}
.hud{position:absolute;inset:0;pointer-events:none;color:var(--gold);text-shadow:0 1px 4px #000}
.room-label{position:absolute;top:18px;left:22px;width:180px;height:27px;image-rendering:pixelated;image-rendering:crisp-edges}
.health-wrap{display:none;position:absolute;right:22px;top:22px;width:190px}
.health-track{height:12px;background:#252b28;border:1px solid #ffffff55;border-radius:999px;overflow:hidden;box-shadow:0 1px 5px #0009}
.health-fill{height:100%;width:100%;border-radius:999px;background:linear-gradient(#71e36b,#279c38);transition:width .18s ease,background .18s ease}
.status{position:absolute;top:20px;left:50%;transform:translateX(-50%);font-size:11px;letter-spacing:.12em;white-space:nowrap}
.actions{position:absolute;right:18px;top:54px;display:flex;gap:7px;pointer-events:auto}
.btn{padding:6px 10px;font:inherit;font-size:10px;letter-spacing:.1em;color:var(--gold);background:#17150dcc;border:1px solid #8c805e88;border-radius:4px;cursor:pointer;text-shadow:0 1px 3px #000}
.btn:hover{background:#34301e}
.controls{position:absolute;left:50%;bottom:13px;transform:translateX(-50%);display:flex;gap:15px;white-space:nowrap;font-size:9px;letter-spacing:.05em;color:var(--gold);text-shadow:0 1px 4px #000;opacity:.72}
.overlay{position:absolute;inset:0;z-index:5;display:none;place-items:center;background:#030505d9;padding:20px;text-align:center}
.dialog{width:min(440px,100%);padding:28px;background:#0d1210ed;border:1px solid #665d43;box-shadow:0 15px 60px #000}
.dialog h1{font-size:clamp(30px,6vw,48px);line-height:1;margin:10px 0;color:var(--gold);letter-spacing:.08em}
.dialog p{color:var(--gold);font-size:12px;max-width:340px;margin:12px auto 20px}
.eyebrow{color:var(--gold);letter-spacing:.25em;font-size:10px}
.pixel-text-canvas{display:inline-block;image-rendering:pixelated;image-rendering:crisp-edges;vertical-align:middle;max-width:100%}
@media(max-width:700px){.room-label{top:12px;left:12px}.health-wrap{right:12px;top:48px;width:145px}.actions{right:10px;top:10px}.status{top:55px}.controls{font-size:8px;gap:7px;bottom:8px;white-space:normal;text-align:center;width:94%;justify-content:center;flex-wrap:wrap}}
</style>
</head>
<body>
<main class="shell">
<section class="gameframe">
<canvas id="game" width="960" height="540" aria-label="First person Rooms game"></canvas>
</section>
<section class="hud">
<canvas id="room-label" class="room-label" width="150" height="23" aria-label="Room counter"></canvas>
<div class="health-wrap" id="health-wrap"><div class="health-track"><div class="health-fill" id="health-fill"></div></div></div>
<div class="status" id="status">LISTEN</div>
<div class="actions"><button class="btn" id="mute">SOUND ON</button><button class="btn" id="pause">PAUSE</button></div>
<div class="controls">
<span>W / S — MOVE</span><span>A / D — STRAFE</span><span>← / → — LOOK</span><span>E — OPEN DOOR</span><span>F — FLASHLIGHT</span><span>SHIFT — RUN</span>
</div>
</section>
<div class="overlay" id="overlay"><div class="dialog"><div class="eyebrow" id="overlay-eyebrow">ROOM 000</div><h1 id="overlay-title">PAUSED</h1><p id="overlay-copy">The hallway is waiting.</p><button class="btn" id="resume">RESUME</button></div></div>
</main>
<script>
(()=>{
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const W=960,H=540,HORIZON=220,FOCAL=430,CAMERA_HEIGHT=1.48,ROOM_LENGTH=22,CORRIDOR_HALF=2.55;
const roomLabel=document.getElementById('room-label'),roomCtx=roomLabel.getContext('2d');
const statusEl=document.getElementById('status'),healthWrap=document.getElementById('health-wrap'),healthFill=document.getElementById('health-fill');
const overlay=document.getElementById('overlay'),overlayTitle=document.getElementById('overlay-title'),overlayCopy=document.getElementById('overlay-copy'),overlayEyebrow=document.getElementById('overlay-eyebrow'),resumeBtn=document.getElementById('resume'),muteBtn=document.getElementById('mute'),pauseBtn=document.getElementById('pause');
let room=0,health=100,flashlight=true,running=true,paused=false,dead=false,mute=false,last=0,audio=null,shake=0;
let keys=Object.create(null),entity=null,entityCooldown=0,doorHint=false,mouseTurn=0;
const player={x:0,z:1,yaw:0,speed:3.25};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
function sound(freq=180,duration=.1,wave='sine',volume=.025){
 if(mute)return;
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  const osc=audio.createOscillator(),gain=audio.createGain();
  osc.type=wave;osc.frequency.value=freq;gain.gain.value=volume;
  osc.connect(gain);gain.connect(audio.destination);osc.start();
  gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);osc.stop(audio.currentTime+duration);
 }catch{}
}
function setStatus(value){statusEl.textContent=value}
function pixelMeasure(ctx2,text,spacing){let width=0;for(let i=0;i<text.length;i++)width+=ctx2.measureText(text[i]).width;if(text.length>1)width+=spacing*(text.length-1);return width}
function pixelDrawLine(ctx2,text,x,y,spacing){let cursor=x;for(const char of text){ctx2.fillText(char,cursor,y);cursor+=ctx2.measureText(char).width+spacing}}
function pixelizeElement(el){
 const text=el.textContent.trim();if(!text)return;
 const style=getComputedStyle(el),size=parseFloat(style.fontSize)||12,lineHeight=parseFloat(style.lineHeight)||size*1.25;
 const spacing=style.letterSpacing==='normal'?0:parseFloat(style.letterSpacing)||0,scale=.82;
 const measure=document.createElement('canvas').getContext('2d');measure.font=style.font||style.fontWeight+' '+size+'px '+style.fontFamily;
 const paragraph=el.tagName==='P',maxWidth=paragraph?Math.max(150,el.clientWidth||340):Infinity;
 const words=text.split(/\s+/),lines=[];let line='';
 for(const word of words){const candidate=line?line+' '+word:word;if(paragraph&&line&&pixelMeasure(measure,candidate,spacing)>maxWidth){lines.push(line);line=word}else line=candidate}
 if(line)lines.push(line);
 const measuredWidth=Math.max(...lines.map(value=>pixelMeasure(measure,value,spacing)),1),cssWidth=paragraph?maxWidth:Math.ceil(measuredWidth+4),cssHeight=Math.ceil(lines.length*lineHeight+2);
 const raster=document.createElement('canvas');raster.className='pixel-text-canvas';raster.width=Math.max(1,Math.ceil(cssWidth*scale));raster.height=Math.max(1,Math.ceil(cssHeight*scale));raster.style.width=cssWidth+'px';raster.style.height=cssHeight+'px';
 if(paragraph){raster.style.display='block';raster.style.margin='0 auto'}
 const paint=raster.getContext('2d');paint.scale(scale,scale);paint.font=measure.font;paint.fillStyle=style.color;paint.textBaseline='alphabetic';
 lines.forEach((value,index)=>{const width=pixelMeasure(paint,value,spacing);const x=style.textAlign==='center'?(cssWidth-width)/2:style.textAlign==='right'?cssWidth-width:0;pixelDrawLine(paint,value,x,index*lineHeight+size,spacing)});
 el.setAttribute('aria-label',text);el.replaceChildren(raster);
}
function installPixelText(){
 const targets=[statusEl,muteBtn,pauseBtn,...document.querySelectorAll('.controls span')];
 for(const el of targets){
  pixelizeElement(el);
  const observer=new MutationObserver(()=>{if(el.children.length===1&&el.firstElementChild.classList.contains('pixel-text-canvas'))return;pixelizeElement(el)});
  observer.observe(el,{childList:true,characterData:true,subtree:true});
 }
}
function updateHud(){
 roomCtx.clearRect(0,0,150,23);roomCtx.fillStyle='#c2b88d';roomCtx.font='700 11px Arial,Helvetica,sans-serif';roomCtx.textBaseline='alphabetic';
 let x=0;for(const char of 'ROOM '+String(room).padStart(3,'0')){roomCtx.fillText(char,x,14);x+=roomCtx.measureText(char).width+1}
 const percent=Math.round(health);healthWrap.style.display=percent<100?'block':'none';healthFill.style.width=percent+'%';
 healthFill.style.background=percent<=33?'linear-gradient(#ff7777,#b51f1f)':percent<=66?'linear-gradient(#f5d66b,#c28a22)':'linear-gradient(#71e36b,#279c38)';
}
function showOverlay(title,copy,button,eyebrow){
 overlayTitle.textContent=title;overlayCopy.textContent=copy;resumeBtn.textContent=button;overlayEyebrow.textContent=eyebrow||'ROOM '+String(room).padStart(3,'0');
 overlay.style.display='grid';
 for(const el of [overlayTitle,overlayCopy,resumeBtn,overlayEyebrow])if(!el.querySelector('.pixel-text-canvas'))pixelizeElement(el);
}
function hideOverlay(){overlay.style.display='none'}
function startNewRun(){
 room=0;health=100;player.x=0;player.z=1;player.yaw=0;entity=null;entityCooldown=0;dead=false;paused=false;running=true;keys=Object.create(null);
 updateHud();setStatus('LISTEN');hideOverlay();last=performance.now();sound(250,.12);requestAnimationFrame(loop);
}
function togglePause(){
 if(dead)return;
 paused=!paused;
 if(paused){setStatus('PAUSED');showOverlay('PAUSED','The hallway is waiting.','RESUME')}
 else{hideOverlay();setStatus('LISTEN');last=performance.now();requestAnimationFrame(loop)}
}
function hurt(amount=15){
 health=Math.max(0,health-amount);shake=14;sound(70,.32,'sawtooth',.055);updateHud();
 if(health<=0){dead=true;running=false;setStatus('LOST');showOverlay('YOU WERE FOUND','Your run ended in room '+String(room).padStart(3,'0')+'.','TRY AGAIN','GAME OVER')}
 else{setStatus('DANGER');player.z=Math.max(room*ROOM_LENGTH+.8,player.z-1.5);entityCooldown=7}
}
function nextRoom(){
 const doorZ=(room+1)*ROOM_LENGTH;
 if(doorZ-player.z>2.35){setStatus('DOOR IS TOO FAR');return}
 room++;player.z=doorZ+1.1;player.x=0;doorHint=false;
 sound(330,.08);setTimeout(()=>sound(220,.14),80);updateHud();setStatus('ROOM ENTERED');
 if(!entity&&entityCooldown<=0&&Math.random()<1/15){
  entity={type:'A-1',x:rand(-.35,.35),z:(room+1)*ROOM_LENGTH-1.4,age:0,phase:'stare',stareTime:1.25,speed:ROOM_LENGTH*.45,damaged:false};
  setStatus('A-1 IS WATCHING');sound(118,.42,'sawtooth',.018);
 }
}
function onKey(e,down){
 const key=e.key.toLowerCase();
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key))e.preventDefault();
 keys[key]=down;
 if(!down)return;
 if(key==='escape'){togglePause();return}
 if(key==='e'){nextRoom();return}
 if(key==='f'){flashlight=!flashlight;sound(420,.045);return}
}
window.addEventListener('keydown',e=>onKey(e,true));
window.addEventListener('keyup',e=>onKey(e,false));
resumeBtn.addEventListener('click',()=>{if(dead)startNewRun();else if(paused)togglePause()});
pauseBtn.addEventListener('click',togglePause);
muteBtn.addEventListener('click',()=>{mute=!mute;muteBtn.textContent=mute?'SOUND OFF':'SOUND ON';if(!mute)sound(300,.05)});
canvas.addEventListener('click',()=>{if(!paused&&!dead)canvas.focus()});
function update(dt){
 const turn=(keys.arrowright?1:0)-(keys.arrowleft?1:0);
 player.yaw+=turn*dt*1.85+mouseTurn;mouseTurn=0;
 const forward=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);
 const strafe=(keys.d?1:0)-(keys.a?1:0);
 const speed=player.speed*(keys.shift?1.45:1);
 const length=Math.hypot(forward,strafe)||1;
 const f=forward/length*speed*dt,s=strafe/length*speed*dt;
 player.x+=Math.cos(player.yaw)*s+Math.sin(player.yaw)*f;
 player.z+=Math.cos(player.yaw)*f-Math.sin(player.yaw)*s;
 player.x=clamp(player.x,-1.55,1.55);
 const doorZ=(room+1)*ROOM_LENGTH;
 player.z=clamp(player.z,room*ROOM_LENGTH+.45,doorZ-.8);
 const distance=doorZ-player.z;
 if(distance<2.6){if(!doorHint){setStatus('PRESS E TO OPEN DOOR');doorHint=true}}
 else if(doorHint){setStatus('LISTEN');doorHint=false}
 if(entity){
  entity.age+=dt;
  if(entity.phase==='stare'){
   if(entity.age>=entity.stareTime){entity.phase='retreat';setStatus('A-1 IS MOVING')}
  }else{
   entity.z-=entity.speed*dt;
   if(!entity.damaged&&Math.abs(entity.z-player.z)<.72&&Math.abs(entity.x-player.x)<.95){
    entity.damaged=true;hurt(15);
   }
   if(entity.z<.25){entity=null;entityCooldown=10;setStatus('QUIET')}
  }
 }
 if(entityCooldown>0)entityCooldown-=dt;
}
function project(wx,wz,height){
 const dx=wx-player.x,dz=wz-player.z;
 const forward=dx*Math.sin(player.yaw)+dz*Math.cos(player.yaw);
 const right=dx*Math.cos(player.yaw)-dz*Math.sin(player.yaw);
 if(forward<.28)return null;
 const scale=FOCAL/forward;
 return {x:W/2+right*scale,y:HORIZON+(CAMERA_HEIGHT-height)*scale,scale,forward};
}
function polygon(points,color,stroke){
 if(points.some(p=>!p))return;
 ctx.beginPath();ctx.moveTo(points[0].x,points[0].y);for(let i=1;i<points.length;i++)ctx.lineTo(points[i].x,points[i].y);ctx.closePath();
 ctx.fillStyle=color;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke()}
}
function drawFloor(){
 const near=player.z+.45,far=player.z+48;
 const points=[project(-CORRIDOR_HALF,near,0),project(CORRIDOR_HALF,near,0),project(CORRIDOR_HALF,far,0),project(-CORRIDOR_HALF,far,0)];
 polygon(points,'#292b24');
 for(let z=Math.floor(near/2)*2;z<far;z+=2){
  const a=project(-CORRIDOR_HALF,z,0),b=project(CORRIDOR_HALF,z,0);
  if(a&&b){ctx.strokeStyle=z%4===0?'#3c3d31':'#303329';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
 for(let x=-2;x<=2;x+=1){
  const a=project(x,near,0),b=project(x,far,0);
  if(a&&b){ctx.strokeStyle='#34362d';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
 }
}
function drawSideWalls(){
 const start=Math.floor((player.z+.4)/2)*2;
 for(let z=start;z<player.z+42;z+=2){
  const z1=Math.max(player.z+.3,z),z2=z+2;
  for(const side of [-1,1]){
   const x=side*CORRIDOR_HALF;
   const points=[project(x,z1,0),project(x,z2,0),project(x,z2,3.55),project(x,z1,3.55)];
   polygon(points,(Math.floor(z/2)%2===0)?(side<0?'#30332b':'#292d27'):(side<0?'#292d26':'#252a24'),'#3d4034');
   const trim1=project(x,z1,3.35),trim2=project(x,z2,3.35);
   if(trim1&&trim2){ctx.strokeStyle='#555342';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(trim1.x,trim1.y);ctx.lineTo(trim2.x,trim2.y);ctx.stroke()}
   if(Math.round(z)%8===0){
    const center=project(x-side*.025,z+1,1.9);
    if(center&&center.x>-60&&center.x<W+60){
     const w=Math.max(2,center.scale*.12),h=Math.max(3,center.scale*.24);
     ctx.fillStyle='#171b16';ctx.fillRect(center.x-w/2,center.y-h/2,w,h);
     ctx.fillStyle='#b5a273';ctx.fillRect(center.x-w*.25,center.y-h*.34,w*.5,h*.68);
    }
   }
   if(Math.round(z)%10===0){
    const zDoor=z+1;
    const p=[project(x,zDoor-.72,0),project(x,zDoor+.72,0),project(x,zDoor+.72,2.55),project(x,zDoor-.72,2.55)];
    polygon(p,'#171c17','#746d50');
    const inner=[project(x-side*.025,zDoor-.58,.08),project(x-side*.025,zDoor+.58,.08),project(x-side*.025,zDoor+.58,2.42),project(x-side*.025,zDoor-.58,2.42)];
    polygon(inner,'#30352b','#8b805e');
   }
  }
 }
}
function drawEndDoor(){
 const doorZ=(room+1)*ROOM_LENGTH;
 const wall=[project(-CORRIDOR_HALF,doorZ,0),project(CORRIDOR_HALF,doorZ,0),project(CORRIDOR_HALF,doorZ,3.6),project(-CORRIDOR_HALF,doorZ,3.6)];
 polygon(wall,'#292d26','#555542');
 const frame=[project(-1.18,doorZ-.015,0),project(1.18,doorZ-.015,0),project(1.18,doorZ-.015,3.1),project(-1.18,doorZ-.015,3.1)];
 polygon(frame,'#111510','#777052');
 const door=[project(-1.02,doorZ-.03,.04),project(1.02,doorZ-.03,.04),project(1.02,doorZ-.03,2.98),project(-1.02,doorZ-.03,2.98)];
 polygon(door,'#3b4032','#a09369');
 const panel=[project(-.82,doorZ-.05,.28),project(.82,doorZ-.05,.28),project(.82,doorZ-.05,2.72),project(-.82,doorZ-.05,2.72)];
 polygon(panel,'#30372d','#626044');
 const handle=project(.72,doorZ-.09,1.35);
 if(handle){ctx.fillStyle='#c1ac72';ctx.beginPath();ctx.arc(handle.x,handle.y,Math.max(1.2,handle.scale*.025),0,Math.PI*2);ctx.fill()}
 const sign=project(0,doorZ-.08,3.27);
 if(sign){ctx.fillStyle='#bcb184';ctx.font='700 '+clamp(sign.scale*.14,8,24)+'px Arial';ctx.textAlign='center';ctx.shadowColor='#000';ctx.shadowBlur=5;ctx.fillText(String(room+1).padStart(3,'0'),sign.x,sign.y);ctx.shadowBlur=0}
}
const a1Sprite=document.createElement('canvas');
a1Sprite.width=160;a1Sprite.height=160;
const a1ctx=a1Sprite.getContext('2d');
function buildA1Sprite(){
 a1ctx.clearRect(0,0,160,160);
 const face=a1ctx.createRadialGradient(77,66,12,80,78,70);
 face.addColorStop(0,'#c3c2b8');face.addColorStop(.72,'#8c8d88');face.addColorStop(1,'#474945');
 a1ctx.fillStyle=face;
 a1ctx.beginPath();a1ctx.moveTo(25,70);a1ctx.bezierCurveTo(20,30,52,10,82,13);a1ctx.bezierCurveTo(122,13,142,44,137,83);a1ctx.bezierCurveTo(134,121,108,146,79,146);a1ctx.bezierCurveTo(45,145,22,116,25,70);a1ctx.fill();
 a1ctx.save();a1ctx.globalAlpha=.34;a1ctx.fillStyle='#ecebe2';
 for(let i=0;i<260;i++){const x=(i*73+19)%160,y=(i*47+31)%160;if(((x-80)**2/3600+(y-80)**2/4900)<1)a1ctx.fillRect(x,y,(i%3)+1,1)}
 a1ctx.restore();
 a1ctx.strokeStyle='#292b29';a1ctx.lineWidth=10;a1ctx.lineCap='round';
 a1ctx.beginPath();a1ctx.arc(56,61,17,.18,Math.PI*1.17);a1ctx.stroke();
 a1ctx.beginPath();a1ctx.arc(104,61,17,1.96,Math.PI*2+.98);a1ctx.stroke();
 a1ctx.fillStyle='#242624';
 a1ctx.beginPath();a1ctx.moveTo(34,93);a1ctx.quadraticCurveTo(80,133,126,92);a1ctx.quadraticCurveTo(82,110,34,93);a1ctx.fill();
 a1ctx.strokeStyle='#e7e5dc';a1ctx.lineWidth=4;a1ctx.beginPath();a1ctx.moveTo(43,98);a1ctx.quadraticCurveTo(80,119,117,98);a1ctx.stroke();
 a1ctx.strokeStyle='#777873';a1ctx.lineWidth=1;
 for(let x=47;x<115;x+=9){a1ctx.beginPath();a1ctx.moveTo(x,100);a1ctx.lineTo(x+1,106);a1ctx.stroke()}
 a1ctx.globalAlpha=.23;a1ctx.fillStyle='#fff';
 for(let y=20;y<145;y+=5)a1ctx.fillRect(30,y,100,1);
 a1ctx.globalAlpha=1;
}
buildA1Sprite();
function drawA1SpriteAt(worldX,worldZ,height,alpha){
 const base=project(worldX,worldZ,0),top=project(worldX,worldZ,height);
 if(!base||!top||base.x<-220||base.x>W+220)return;
 const h=base.y-top.y,w=h*.92;
 if(h<2)return;
 ctx.save();ctx.globalAlpha=alpha;ctx.imageSmoothingEnabled=false;
 ctx.drawImage(a1Sprite,base.x-w/2,top.y,w,h);
 ctx.restore();
}
function drawA1(){
 if(!entity)return;
 if(entity.phase==='stare'){drawA1SpriteAt(entity.x,entity.z,3.05,.98);return}
 for(let i=3;i>=1;i--)drawA1SpriteAt(entity.x,entity.z+i*1.15,3.05,.11/i);
 drawA1SpriteAt(entity.x,entity.z,3.05,.98);
 const sign=project(entity.x,entity.z,3.45);
 if(sign&&entity.age%1.4<.45){
  ctx.save();ctx.globalAlpha=.55;ctx.fillStyle='#c2b88d';ctx.font='700 12px Arial';ctx.textAlign='center';ctx.fillText('HA!',sign.x,sign.y-8);ctx.restore();
 }
}
function drawPixelCanvasText(text,x,baseline,font,color,align){
 const temp=document.createElement('canvas'),measure=temp.getContext('2d');measure.font=font;
 const size=parseFloat(font.match(/[0-9.]+px/)?.[0]||'13'),width=Math.ceil(measure.measureText(text).width+8),height=Math.ceil(size*1.8),scale=.82;
 temp.width=Math.ceil(width*scale);temp.height=Math.ceil(height*scale);
 const p=temp.getContext('2d');p.scale(scale,scale);p.font=font;p.fillStyle=color;p.textBaseline='alphabetic';p.fillText(text,4,size*1.25);
 const left=align==='center'?x-width/2:x;
 ctx.save();ctx.imageSmoothingEnabled=false;ctx.drawImage(temp,left,baseline-size*1.25,width,height);ctx.restore();
}
function draw(){
 ctx.save();
 if(shake>0){ctx.translate(rand(-shake,shake),rand(-shake,shake));shake*=.84}
 const ceiling=ctx.createLinearGradient(0,0,0,HORIZON);ceiling.addColorStop(0,'#050807');ceiling.addColorStop(1,'#151914');
 ctx.fillStyle=ceiling;ctx.fillRect(0,0,W,HORIZON+2);
 const floorShade=ctx.createLinearGradient(0,HORIZON,0,H);floorShade.addColorStop(0,'#20231e');floorShade.addColorStop(1,'#080b09');
 ctx.fillStyle=floorShade;ctx.fillRect(0,HORIZON,W,H-HORIZON);
 drawFloor();drawSideWalls();drawEndDoor();drawA1();
 ctx.restore();
 ctx.save();
 const darkness=ctx.createRadialGradient(W/2,H*.58,35,W/2,H*.58,flashlight?410:225);
 darkness.addColorStop(0,'rgba(0,0,0,0)');darkness.addColorStop(.62,'rgba(0,0,0,.18)');darkness.addColorStop(1,flashlight?'rgba(0,0,0,.68)':'rgba(0,0,0,.94)');
 ctx.fillStyle=darkness;ctx.fillRect(0,0,W,H);ctx.restore();
 if(entity&&entity.phase==='stare')drawPixelCanvasText('A-1',W/2,H-55,'700 13px Arial,Helvetica,sans-serif','#c2b88d','center');
}
function loop(t){
 if(!running||paused||dead)return;
 const dt=Math.min((t-last)/1000,.04);last=t;update(dt);draw();requestAnimationFrame(loop);
}
installPixelText();updateHud();last=performance.now();requestAnimationFrame(loop);
})();
